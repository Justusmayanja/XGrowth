<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowthApp — Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Start building your AI growth agent</p>

      <div id="error" class="error hidden"></div>

      <form id="register-form">
        <div>
          <label for="name">Name</label>
          <input id="name" type="text" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="8" />
        </div>
        <div>
          <label for="password_confirmation">Confirm password</label>
          <input id="password_confirmation" type="password" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p class="subtitle" style="margin-top:1rem;text-align:center">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, setToken } from './js/api.js';

    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      try {
        const data = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            password_confirmation: document.getElementById('password_confirmation').value,
          }),
        });
        setToken(data.token);
        window.location.href = 'onboarding.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
