<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowthApp — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <h1>GrowthApp</h1>
      <p class="subtitle">AI Growth Agent for X</p>

      <div id="error" class="error hidden"></div>

      <form id="login-form">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@example.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <p class="subtitle" style="margin-top:1rem;text-align:center">
        No account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, setToken, getToken } from './js/api.js';

    if (getToken()) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        setToken(data.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
